name: Build

on:
  push:
    branches: [ '*' ]

jobs:
  build:
    runs-on: homelab-amd64
    container:
      image: gitea.main-server.home/electronya/electronya-firm-builder:latest

    env:
      NODE_TLS_REJECT_UNAUTHORIZED: '0'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: app

    - name: Configure SSH deploy key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.ORG_ZEPHYR_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H gitea.main-server.home >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Initialize west workspace
      run: |
        west init -l app
        west update
        west zephyr-export

    - name: Build firmware
      run: |
        west build -b b_g474e_dpow1 app
